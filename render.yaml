# Render 배포 설정 (Blueprint). Render 대시보드 → New → Blueprint 에서 이 저장소를 고르면 자동으로 만들어져요.
services:
  - type: web
    name: sunny-english-tutor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # 배포할 때 Render 화면에서 직접 입력 (저장소에는 넣지 않아요)
      # 구글 로그인 (Firebase 프로젝트 설정 → 내 앱 → SDK 설정에서 복사)
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      # 비워 두면 로그인한 누구나 AI 사용, 이메일을 쉼표로 적으면 그 계정만 사용
      - key: ALLOWED_EMAILS
        sync: false
      - key: NODE_VERSION
        value: "22"
